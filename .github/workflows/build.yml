name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-desktop:
    name: Desktop Build (Linux)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev
          sudo apt-get remove -y cmake
          sudo apt-get install -y cmake
          which cmake
          cmake --version

      - name: Install aqtinstall
        run: pip3 install aqtinstall

      - name: Install Qt
        run: aqt install-qt linux desktop 6.8.0 linux_gcc_64 -m qtcharts -O ~/Qt

      - name: Debug cmake
        run: |
          ls /usr/share/cmake-3.22/Modules/ | grep -i "Cxx" || echo "modules missing"
          ls /usr/lib/cmake/ || echo "no cmake lib"
          dpkg -l cmake cmake-data

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeSim-Linux
          path: build/desktop-release/TradeSim