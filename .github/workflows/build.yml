name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-desktop:
    name: Desktop Build (Linux)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgl1-mesa-dev

      - name: Install aqtinstall
        run: pip3 install aqtinstall

      - name: Install Qt
        run: aqt install-qt linux desktop 6.8.0 linux_gcc_64 -m qtcharts -O ~/Qt

      - name: Configure
        run: cmake -B build/desktop-release -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=${HOME}/Qt/6.8.0/gcc_64

      - name: Build
        run: cmake --build build/desktop-release --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeSim-Linux
          path: build/desktop-release/TradeSim