name: CI

on:
 push:
   branches: [main,develop]
 pull_request:
   branches: [main]

jobs:
  build-desktop:
    name: Desktop Build (Windows)
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install aqtinstall
        run: pip install aqtinstall

      - name: Install Qt
        run: aqt install-qt windows desktop 6.8.0 win64_msvc2022_64 -m qtcharts -O D:\Qt

      
      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure
        env:
          CXX: cl
          CC: cl
        run: cmake -B build/desktop-release -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=D:\Qt\6.8.0\msvc2022_64

      - name: Build
        run: cmake --build build/desktop-release --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeSim-Windows
          path: build/desktop-release/TradeSim.exe
