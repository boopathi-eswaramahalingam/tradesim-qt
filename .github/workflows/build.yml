name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-desktop:
    name: Desktop Build (Linux)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev

      - name: Install aqtinstall
        run: pip3 install aqtinstall

      - name: Install Qt
        run: aqt install-qt linux desktop 6.8.0 linux_gcc_64 -m qtcharts -O ~/Qt

      - name: Install CMake
        run: |
          wget -q https://github.com/Kitware/CMake/releases/download/v3.28.4/cmake-3.28.4-linux-x86_64.sh
          sudo mkdir -p /opt/cmake
          sudo sh cmake-3.28.4-linux-x86_64.sh --prefix=/opt/cmake --skip-license
          ls /opt/cmake/

      - name: Configure
        run: /opt/cmake/bin/cmake -B build/desktop-release -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=${HOME}/Qt/6.8.0/gcc_64 -DCMAKE_CXX_COMPILER=/usr/bin/g++ -DCMAKE_C_COMPILER=/usr/bin/gcc

      - name: Build
        run: /opt/cmake/bin/cmake --build build/desktop-release --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeSim-Linux
          path: build/desktop-release/TradeSim