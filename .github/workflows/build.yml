name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-desktop:
    name: Desktop Build (Windows)
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install aqtinstall
        run: pip install aqtinstall

      - name: Install Qt MinGW kit
        run: aqt install-qt windows desktop 6.8.0 win64_mingw -m qtcharts -O D:\Qt

      - name: Install MinGW compiler
        run: aqt install-tool windows desktop tools_mingw1310_64 -O D:\Qt

      - name: Configure
        run: cmake -B build/desktop-release -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=D:\Qt\6.8.0\mingw_64 -DCMAKE_CXX_COMPILER=D:\Qt\Tools\mingw1310_64\bin\g++.exe -DCMAKE_C_COMPILER=D:\Qt\Tools\mingw1310_64\bin\gcc.exe

      - name: Build
        run: cmake --build build/desktop-release --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeSim-Windows
          path: build/desktop-release/TradeSim.exe